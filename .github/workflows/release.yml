name: Publish beta update

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, matching package.json and tauri.conf.json, for example 1.3.2'
        required: true
      draft:
        description: 'Build as a draft so it can be tested on the desktop before anyone receives it. Publish the draft on the Releases page to go live.'
        type: boolean
        required: false
        default: true
  push:
    tags:
      - 'v*'

jobs:
  publish-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      # FFmpeg ships INSIDE the installer. Users were being asked to download
      # it on first run before thumbnails worked; a media library that cannot
      # make thumbnails out of the box is broken out of the box. Staged here at
      # build time rather than committed — a 90MB binary pair does not belong
      # in git history. The finder already prefers this bundled copy.
      - name: Stage bundled FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile $zip
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-extract'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $dest = 'src-tauri/resources/ffmpeg'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $ffmpeg = Get-ChildItem -Path $extract -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extract -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg archive did not contain the expected binaries' }
          Copy-Item $ffmpeg.FullName (Join-Path $dest 'ffmpeg.exe')
          Copy-Item $ffprobe.FullName (Join-Path $dest 'ffprobe.exe')
          & (Join-Path $dest 'ffmpeg.exe') -version | Select-Object -First 1

      - name: Build and publish signed Windows update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          releaseName: ${{ github.event_name == 'workflow_dispatch' && format('Salafi Video Hub Beta v{0}', inputs.version) || format('Salafi Video Hub Beta {0}', github.ref_name) }}
          releaseBody: 'Signed beta build with in-app updater metadata.'
          # A draft release is fully built and signed, and its installer can be
          # downloaded from the Releases page, but GitHub's /releases/latest —
          # which is the updater endpoint — only ever resolves to a published,
          # non-prerelease release. So a draft reaches nobody until it is
          # published by hand. That is the desktop test window.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  # Linux runs AFTER Windows, deliberately: both jobs upload latest.json to
  # the same release, and tauri-action merges platform entries into whatever
  # is already there — sequencing removes the race where two concurrent jobs
  # each upload a json that only knows its own platform. If this job fails,
  # the Windows release is already complete and untouched; Linux users just
  # wait for the next tag.
  publish-linux:
    permissions:
      contents: write
    needs: publish-windows
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish signed Linux update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          releaseName: ${{ github.event_name == 'workflow_dispatch' && format('Salafi Video Hub Beta v{0}', inputs.version) || format('Salafi Video Hub Beta {0}', github.ref_name) }}
          releaseBody: 'Signed beta build with in-app updater metadata.'
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          uploadUpdaterJson: true

  # Mirrors the finished release into the PUBLIC releases repository. This is
  # what makes the source repo's future privacy safe: clients from 1.45.0
  # onward poll the public repo's latest.json FIRST, so once this job runs on
  # a release, flipping the source repo private cannot strand anyone.
  #
  # The one subtlety: latest.json's platform URLs point at the SOURCE repo's
  # assets. Mirrored verbatim, they would 404 the moment the source goes
  # private — so they are rewritten to the public repo's paths before upload.
  # The signatures do not change: they sign the artifact bytes, not the URL.
  mirror-public:
    permissions:
      contents: read
    needs: publish-linux
    runs-on: ubuntu-22.04
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.draft == true) }}
    steps:
      - name: Mirror release assets to the public repository
        env:
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
          PUBLIC_REPO: osmanhamo135-pixel/salafi-video-hub-releases
        run: |
          set -euo pipefail
          mkdir assets
          cd assets
          GH_TOKEN="$SOURCE_TOKEN" gh release download "$TAG" --repo "$SOURCE_REPO"
          if [ -f latest.json ]; then
            python3 - <<'PY'
          import json
          import os
          with open('latest.json') as f:
              data = json.load(f)
          src = os.environ['SOURCE_REPO']
          pub = os.environ['PUBLIC_REPO']
          for platform in data.get('platforms', {}).values():
              if 'url' in platform:
                  platform['url'] = platform['url'].replace(f'/{src}/', f'/{pub}/')
          with open('latest.json', 'w') as f:
              json.dump(data, f, indent=2)
          PY
          fi
          # Draft -> upload -> publish, in that order, deliberately. A release
          # created live becomes /releases/latest IMMEDIATELY, while its
          # latest.json is still uploading — and every client that checks for
          # updates inside that window gets a raw 404. The owner hit exactly
          # this. A draft is invisible to /latest until the flip, which is
          # atomic: the new version appears only when every asset is already
          # in place.
          if ! gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$PUBLIC_REPO" --draft \
              --title "Salafi Video Hub $TAG" \
              --notes "Official signed build. The application source is proprietary — see the licence shipped with the app."
          fi
          gh release upload "$TAG" ./* --repo "$PUBLIC_REPO" --clobber
          gh release edit "$TAG" --repo "$PUBLIC_REPO" --draft=false
